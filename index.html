<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Localify</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #181818;
      --bg-hover: #282828;
      --green: #1DB954;
      --text-main: #FFFFFF;
      --text-sub: #B3B3B3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    .top-bar {
      padding: 16px 20px; background-color: #000; display: flex;
      align-items: center; justify-content: space-between; border-bottom: 1px solid #222;
    }
    .logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--green); }
    
    .upload-btn {
      background-color: var(--green); color: #000; font-weight: bold; font-size: 13px;
      padding: 10px 16px; border-radius: 20px; cursor: pointer;
    }
    input[type="file"] { display: none; }

    .content { flex: 1; padding: 16px; overflow-y: auto; }
    .header { margin-bottom: 16px; }
    .header h1 { font-size: 24px; margin-bottom: 4px; }
    .header p { color: var(--text-sub); font-size: 13px; }
    
    .track-list { width: 100%; border-collapse: collapse; }
    .track-row { border-radius: 8px; cursor: pointer; }
    .track-row:active { background-color: var(--bg-hover); }
    .track-row.active { color: var(--green); background-color: rgba(29, 185, 84, 0.12); }
    .track-row td { padding: 14px 10px; font-size: 15px; border-bottom: 1px solid #1f1f1f; }
    .track-num { width: 34px; color: var(--text-sub); font-size: 13px; }
    .track-row.active .track-num { color: var(--green); }

    .player-bar {
      background-color: var(--bg-card); border-top: 1px solid #282828;
      padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .now-playing { text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .now-playing-title { font-weight: 600; font-size: 16px; }
    .now-playing-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

    .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-sub); }
    input[type="range"] { flex: 1; accent-color: var(--green); height: 5px; }

    .buttons { display: flex; align-items: center; justify-content: center; gap: 32px; }
    .ctrl-btn { background: none; border: none; color: var(--text-sub); font-size: 22px; padding: 6px; }
    .play-pause-btn {
      background-color: var(--text-main); color: #000; width: 48px; height: 48px;
      border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="logo"><span>●</span> Localify</div>
    <label class="upload-btn">
      + Select Folder
      <input type="file" id="folderInput" webkitdirectory directory multiple accept="audio/*">
    </label>
  </div>

  <div class="content">
    <div class="header">
      <h1>Your Library</h1>
      <p id="trackCount">Tap "+ Select Folder" above</p>
    </div>
    <table class="track-list" id="trackList"></table>
  </div>

  <div class="player-bar">
    <div class="now-playing">
      <div class="now-playing-title" id="currentTitle">Not Playing</div>
      <div class="now-playing-sub" id="currentFolder">Ready to play</div>
    </div>

    <div class="progress-container">
      <span id="currentTime">0:00</span>
      <input type="range" id="seekBar" value="0" min="0" max="100">
      <span id="duration">0:00</span>
    </div>

    <div class="buttons">
      <button class="ctrl-btn" id="shuffleBtn">🔀</button>
      <button class="ctrl-btn" id="prevBtn">⏮</button>
      <button class="ctrl-btn play-pause-btn" id="playPauseBtn">▶</button>
      <button class="ctrl-btn" id="nextBtn">⏭</button>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const folderInput = document.getElementById('folderInput');
    const trackList = document.getElementById('trackList');
    const trackCount = document.getElementById('trackCount');
    const audio = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const seekBar = document.getElementById('seekBar');
    const currentTitle = document.getElementById('currentTitle');
    const currentFolder = document.getElementById('currentFolder');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    let songs = [];
    let currentIndex = 0;
    let isShuffle = false;

    folderInput.addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      songs = files.filter(function(file) {
        return file.type.startsWith('audio/') || /\.(mp3|wav|m4a|ogg|flac)$/i.test(file.name);
      });
      songs.sort(function(a, b) { return a.name.localeCompare(b.name); });
      
      trackCount.textContent = songs.length + ' songs loaded';
      renderPlaylist();
      if (songs.length > 0) loadSong(0, true);
    });

    function renderPlaylist() {
      trackList.innerHTML = '';
      songs.forEach(function(song, index) {
        const tr = document.createElement('tr');
        tr.className = 'track-row';
        tr.id = 'track-' + index;
        const cleanName = song.name.replace(/\.[^/.]+$/, "");
        tr.innerHTML = '<td class="track-num">' + (index + 1) + '</td><td>' + cleanName + '</td>';
        tr.onclick = function() { loadSong(index, true); };
        trackList.appendChild(tr);
      });
    }

    function loadSong(index, autoPlay) {
      if (songs.length === 0) return;
      currentIndex = index;
      const song = songs[currentIndex];
      
      if (audio.src) URL.revokeObjectURL(audio.src);
      audio.src = URL.createObjectURL(song);
      
      currentTitle.textContent = song.name.replace(/\.[^/.]+$/, "");
      currentFolder.textContent = song.webkitRelativePath.split('/') || "Music Folder";

      document.querySelectorAll('.track-row').forEach(function(row) { row.classList.remove('active'); });
      const activeRow = document.getElementById('track-' + currentIndex);
      if (activeRow) activeRow.classList.add('active');

      if (autoPlay) {
        audio.play();
        playPauseBtn.textContent = '⏸';
      }
    }

    playPauseBtn.onclick = function() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        playPauseBtn.textContent = '⏸';
      } else {
        audio.pause();
        playPauseBtn.textContent = '▶';
      }
    };

    nextBtn.onclick = function() {
      if (songs.length === 0) return;
      currentIndex = isShuffle ? Math.floor(Math.random() * songs.length) : (currentIndex + 1) % songs.length;
      loadSong(currentIndex, true);
    };

    prevBtn.onclick = function() {
      if (songs.length === 0) return;
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      loadSong(currentIndex, true);
    };

    shuffleBtn.onclick = function() {
      isShuffle = !isShuffle;
      shuffleBtn.style.color = isShuffle ? '#1DB954' : '#B3B3B3';
    };

    audio.addEventListener('ended', function() { nextBtn.click(); });

    audio.addEventListener('timeupdate', function() {
      if (audio.duration) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    seekBar.oninput = function() {
      if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
    };

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
  </script>
</body>
</html>
